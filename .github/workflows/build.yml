name: Build Radinho
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target Radinho_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: Radinho-VST3-${{ matrix.os }}
          path: build/Radinho_artefacts/Release/VST3/
